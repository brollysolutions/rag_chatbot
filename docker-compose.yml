services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: brolly_rag_chatbot_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 2G

  web:
    build: .
    container_name: brolly_rag_bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENV=development
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - hf_cache:/root/.cache/huggingface
      - .:/app
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  qdrant_data:
  hf_cache: